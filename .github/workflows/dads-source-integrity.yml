name: DADS source integrity

on:
  pull_request:
    paths:
      - "vendor/dads/**"
      - "src/vendor/dads-runtime/**"
      - "scripts/sync-dads-components.mjs"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - "vendor/dads/**"
      - "src/vendor/dads-runtime/**"
      - "scripts/sync-dads-components.mjs"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run verify:dads
